server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # stats.json 是纯文本 JSON, gzip 后约为原来的 1/5; 面板开着就一直在拉, 省下的是主控机出站流量
    gzip            on;
    gzip_min_length 512;
    gzip_proxied    any;
    gzip_types      application/json application/javascript text/css image/svg+xml;

    # 面板要求实时, 页面/样式/脚本一律不许被浏览器或 CDN 缓存住,
    # 否则每次更新前端都得手动 purge 一次 CDN。
    # no-cache = 允许存但必须回源校验(命中 304 很便宜), 不是 no-store。
    location / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri/ =404;
    }

    # 探针数据 5s 拉一次, 彻底不缓存。
    # srv 每分钟才把 stats.json 落盘一次, 实时数据要反代到 srv:80;
    # 用变量 + resolver 让 nginx 每次解析, srv 重建换 IP 后不必重启 web
    location /json/ {
        resolver 127.0.0.11 valid=10s;
        set $srv_upstream http://srv:80;
        proxy_pass $srv_upstream;
        add_header Cache-Control "no-store" always;
    }
}
