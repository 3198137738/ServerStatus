name: sss

services:
  # ServerStatus server (cppla 2.0, Go): 接收 agent 上报(35601), 容器内 :80 提供实时 /json/stats.json;
  # json/stats.json 落盘每分钟一次, 仅用于重启后恢复数据
  srv:
    image: cppla/serverstatus:latest
    restart: unless-stopped
    volumes:
      - ./config.json:/app/config/config.json
      - ./json:/app/data
    ports:
      - ${REPORT_PORT:-35601}:35601

  # 前端面板: 静态资源打包进镜像, 运行时读取共享的 json/stats.json
  web:
    build:
      context: ./service/web
    restart: unless-stopped
    volumes:
      - ./json:/usr/share/nginx/html/json:ro
    ports:
      - ${WEB_PORT:-8081}:80
    depends_on:
      - srv

  # Telegram 上下线通知
  bot:
    build:
      context: ./service/bot
    restart: unless-stopped
    depends_on:
      - srv
    environment:
      - TG_CHAT_ID=${TG_CHAT_ID:-}
      - TG_BOT_TOKEN=${TG_BOT_TOKEN:-}
